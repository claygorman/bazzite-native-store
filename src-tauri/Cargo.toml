[package]
name = "bazzite-store"
version = "0.5.0"
description = "Controller-first Steam store client for Bazzite Game Mode"
authors = ["Clay Gorman"]
edition = "2021"

# ⚠️ Both halves of this are load-bearing, and 0.4.0 shipped without them.
#
# Cargo AUTO-DISCOVERS every file under `src/bin/` as an extra binary target. Adding
# `src/bin/protondb-index.rs` therefore gave this crate two binaries, and with neither
# `default-run` here nor `mainBinaryName` in tauri.conf.json set, the bundler had no way
# to know which one is the app. It picked the indexer: the 0.4.0 AppImage contained
# `usr/bin/protondb-index` and NO `bazzite-store` at all, with `Exec=protondb-index` in
# the desktop entry, so launching it printed a usage string and exited.
#
# ⚠️ `default-run` alone fixes which binary launches and still ships the other one — 9.3
# MB of build-time tooling inside the app image. `autobins = false` plus explicit
# sections is what stops a future file in `src/bin/` re-creating the ambiguity silently.
default-run = "bazzite-store"
autobins = false

[[bin]]
name = "bazzite-store"
path = "src/main.rs"

# The dump indexer. Build-time tooling, never part of the app:
#   cargo run --features tooling --bin protondb-index -- <out-dir> [archive.tar.gz]
[[bin]]
name = "protondb-index"
path = "src/bin/protondb-index.rs"
required-features = ["tooling"]

[features]
# Off by default, which is the whole point: a release build must not produce this
# target, so the bundler cannot pick it up even if the guards above are edited away.
tooling = []

[lib]
name = "bazzite_store_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The updater and the relaunch it needs. AppImage is the one Linux format Tauri can
# swap without elevation, which is exactly the shipping route on an immutable ostree
# (README §4) — a .deb/.rpm updater would need root and be undone by the next rebase.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than native-tls: one less system library to satisfy inside a Flatpak
# sandbox, which is the intended shipping route (README §4).
# ⚠️ `stream` is what provides `Response::bytes_stream`, and its absence reads as
# "no method named `bytes_stream`" — a missing-feature error that looks like a version
# problem. Needed so the 66 MB ProtonDB download can report progress rather than
# arriving as one opaque blob. (`json` is still deliberately absent; we parse text.)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
# `net` is for the CDP WebSocket below; the rest were already here.
tokio = { version = "1", features = ["time", "rt", "net"] }
# Steam's CEF debugger. `Runtime.evaluate` is only reachable over the WebSocket — CDP's
# HTTP endpoints cannot evaluate — and this is ws:// to 127.0.0.1, so no TLS feature.
tokio-tungstenite = "0.24"
# `sink` is the CDP WebSocket; `std` brings StreamExt, which is what lets the ProtonDB
# download report progress instead of arriving as one opaque 66 MB blob.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gilrs = "0.11"
thiserror = "2"
serde_urlencoded = "0.7"
# ProtonDB's open data dump ships as .tar.gz. `reqwest`'s `gzip` feature only handles
# HTTP content-encoding, which is a different thing from a gzipped file body — so the
# archive has to be decompressed and untarred here.
flate2 = "1"
tar = "0.4"
# ⚠️ `bundled` compiles SQLite into the binary rather than linking whatever the host
# ships. Costs ~1.5 MB and a C compiler at build time (the toolchain already needs one),
# and buys the guarantee that the desktop app, CI and a Bazzite image are all running
# the SAME SQLite — on an immutable ostree the system copy is outside our control, and
# a version skew there would only surface on the target hardware.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# The live CEF test is async; the app itself never needs the macros.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
