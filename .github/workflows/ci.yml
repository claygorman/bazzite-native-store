# Verify — the GitHub counterpart of the GitLab `build` stage.
#
# Runs on every pull request and every push to main, which is the same gate the
# GitLab `workflow.rules` block enforces there.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A second push to the same branch cancels the first. Nothing here has a side
  # effect, so an in-flight run is only ever wasted minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does the Flatpak manifest still build?
  #
  # ⚠️ Here rather than only in `release.yml`, because that job is gated behind a
  # published release — which would make the release itself the manifest's first test,
  # and a manifest breaks for dull reasons: a runtime branch goes EOL, an SDK extension
  # moves with the freedesktop base, a build command drifts from package.json.
  #
  # ⚠️ It still cannot verify the thing the Flatpak EXISTS to fix. A bundle that builds
  # and installs cleanly can still fail to create an EGL display on hardware GitHub does
  # not have. Only the box answers that — docs/PACKAGING.md carries the one-liner.
  #
  # Path-gated so ordinary frontend work does not pay for an SDK download.
  flatpak:
    name: Flatpak builds
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.message, 'flatpak') ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Runtime and SDK
        run: |
          flatpak --system remote-add --if-not-exists --from flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak --system install -y --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.node24//25.08

      - name: Build
        run: |
          flatpak-builder --disable-rofiles-fuse --repo=repo --force-clean \
            build flatpak/com.claygorman.bazzite-store.yml

      # Same assertion the release makes: the artifact contains the app, not just a
      # successful build.
      - name: The build contains the app
        run: |
          set -euo pipefail
          test -x build/files/bin/bazzite-store \
            || { echo "::error::no bazzite-store binary in the flatpak build"; ls -R build/files/bin || true; exit 1; }
          test -f build/files/share/applications/com.claygorman.bazzite-store.desktop \
            || { echo "::error::desktop entry missing"; exit 1; }
          test -f build/files/share/metainfo/com.claygorman.bazzite-store.metainfo.xml \
            || { echo "::error::metainfo missing"; exit 1; }
          echo "flatpak build contains the app, its desktop entry and its metainfo"

  frontend:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ⚠️ No `version:` here on purpose — it is read from `packageManager` in
      # package.json, so CI and a laptop cannot drift. Without either, this action
      # fails with "No pnpm version is specified", which is how the first run died.
      # It must also come BEFORE setup-node, or `cache: pnpm` has no pnpm to ask.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # ⚠️ `cache: pnpm` stays EXPLICIT. setup-node v5 added automatic caching from
          # the `packageManager` field, then v6 narrowed that automation to npm only —
          # so with `pnpm@…` in package.json nothing is cached unless we say so here.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # ⚠️ `node --experimental-strip-types`, not vitest — that is this repo's test
      # runner, so the tests must be leaf modules with no DOM imports and explicit
      # `.ts` extensions on relative imports.
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Non-blocking: this repo was hand-formatted long before Prettier arrived, and
      # a failing format check on an untouched file teaches people to ignore CI.
      - name: Format check
        run: pnpm format:check
        continue-on-error: true

  rust:
    name: Rust
    # ⚠️ Kept in step with the release job's Linux runner ON PURPOSE — CI that builds
    # on a different image than the release validates the wrong thing. Moved from
    # 22.04 to 24.04 together with it: the AppImage bundles WebKitGTK from the runner,
    # and the 2022 copy could not create an EGL display on the target box, so 0.3.1
    # shipped a window that painted solid white. The full account is in the release
    # workflow's matrix comment; do not move one of these without the other.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # ⚠️ `@stable` is a moving ref that tracks the current Rust release, and is
      # what this action documents. It is not a version tag to bump.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # v2 IS the latest major — not a stale pin.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ⚠️ Tauri v2 wants webkit2gtk **4.1**. The 4.0 package is what every v1 guide
      # installs and it fails at link time with a message that does not mention the
      # version at all.
      # ⚠️ `libudev-dev` is not optional here and is easy to miss: `gilrs` — the whole
      # gamepad layer — pulls `libudev-sys`, whose build script panics with
      # "Package libudev was not found in the pkg-config search path". Nothing in the
      # error names gilrs or the gamepad, so it reads like a toolchain problem.
      # `libdbus-1-dev` is `libdbus-sys`, reached the same way through Tauri.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libudev-dev libdbus-1-dev \
            build-essential curl wget file patchelf

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        continue-on-error: true

      # The live CEF test is `#[ignore]`d and stays that way — it needs a running,
      # logged-in Steam client, which no runner has.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
