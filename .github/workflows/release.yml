# Release — the GitHub counterpart of the GitLab `release` stage.
name: Release

on:
  # ⚠️ Manual, mirroring `when: manual` on the GitLab `semantic-release` job.
  # Cutting a release also publishes an update that every installed client will
  # offer to install, so it is a decision rather than a consequence of merging.
  workflow_dispatch:

concurrency:
  # Never two releases at once — they would race for the same tag.
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tags, commits and releases

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      published: ${{ steps.semantic.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the whole history to work out the next version
          # from the commits since the last tag.
          fetch-depth: 0
          persist-credentials: true

      # ⚠️ No `version:` here on purpose — it is read from `packageManager` in
      # package.json, so CI and a laptop cannot drift. Without either, this action
      # fails with "No pnpm version is specified", which is how the first run died.
      # It must also come BEFORE setup-node, or `cache: pnpm` has no pnpm to ask.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # ⚠️ `cache: pnpm` stays EXPLICIT. setup-node v5 added automatic caching from
          # the `packageManager` field, then v6 narrowed that automation to npm only —
          # so with `pnpm@…` in package.json nothing is cached unless we say so here.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: semantic
        env:
          # The default token is enough here: same-repo tags, commits and releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          npx semantic-release
          git fetch --tags --force
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

          # ⚠️ Compare the tag before and after rather than trusting the exit code.
          # semantic-release exits 0 when it decides NOT to release (no feat/fix
          # since the last tag), and a build job that ran anyway would rebuild and
          # re-upload the previous version's assets over themselves.
          if [ "$before" != "$after" ]; then
            echo "published=true"     >> "$GITHUB_OUTPUT"
            echo "version=$after"     >> "$GITHUB_OUTPUT"
            echo "Released $after"
          else
            echo "published=false"    >> "$GITHUB_OUTPUT"
            echo "No release: nothing since $before warrants one."
          fi

  bundles:
    name: ${{ matrix.slug }}
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # ⚠️ One platform failing must not block the others. Linux is the shipping
      # target; macOS and Windows are a convenience, and losing them to a transient
      # runner problem should not cost the release.
      fail-fast: false
      matrix:
        include:
          # ⚠️ ubuntu-24.04, and the history matters because the obvious "fix" is to
          # put it back. This was ubuntu-22.04 on the correct reasoning that the oldest
          # supported runner links the oldest glibc, and a binary built on a newer one
          # refuses to start on an older host with a bare "GLIBC_2.xx not found".
          #
          # That reasoning was right about glibc and missed what else the pin freezes.
          # Tauri's AppImage bundler ships WebKitGTK — plus its GStreamer and GLib
          # dependencies, 165 libraries in all — taken from the RUNNER. A 2022 WebKit
          # cannot create an EGL display against Mesa 26.2 on RDNA 4, so release 0.3.1
          # launched on the target box, kept running, enumerated both controllers, and
          # painted a solid white window:
          #
          #   Could not create default EGL display: EGL_BAD_PARAMETER. Aborting...
          #
          # Root-caused on the real hardware 2026-08-22 (Bazzite 44.20260820, Radeon RX
          # 9070 XT, Mesa 26.2.1, host WebKitGTK 2.52.5). ⚠️ There is NO runtime
          # workaround — WEBKIT_DISABLE_DMABUF_RENDERER, WEBKIT_DISABLE_COMPOSITING_MODE
          # and LIBGL_ALWAYS_SOFTWARE all still abort, and removing the bundled WebKit
          # to fall back on the host's cascades into undefined symbols across GStreamer
          # and GLib. It can only be fixed where the bundle is built.
          #
          # The glibc floor rises in exchange, and that is an acceptable trade HERE and
          # only here: the stated target is Bazzite 44, which is Fedora 44. It is not a
          # general-purpose Linux build.
          #
          # ⚠️ The real answer is a Flatpak, which uses the runtime's WebKit and bundles
          # no browser at all — see private/TASKS.md. This unblocks the AppImage; it does
          # not make the AppImage the right shape.
          #
          # ⚠️ CI cannot catch a recurrence. This failure is invisible to a build that
          # only checks the build succeeded — the artifact is valid, signed and runnable,
          # and simply does not paint.
          #
          # ⚠️ `.AppImage`, NOT `.AppImage.tar.gz`. Tauri v1 tarballed the AppImage
          # before signing; v2 signs the AppImage itself, so the updater artifact and
          # the human download are the SAME file and there is no `ship:` here. Measured
          # on release 0.2.0, whose bundle dir held exactly:
          #   bazzite-store_0.2.0_amd64.AppImage
          #   bazzite-store_0.2.0_amd64.AppImage.sig
          - os: ubuntu-24.04
            target: linux-x86_64
            slug: linux-x86_64
            bundles: appimage
            dir: src-tauri/target/release/bundle/appimage
            suffix: .AppImage
            ship: ''
            rustTargets: ''
            tauriArgs: ''
          # ⚠️ ONE macOS job producing a UNIVERSAL binary, covering both architectures.
          #
          # There is no Intel macOS runner to build on any more: GitHub retired
          # `macos-13`, and every current image (macos-14/15/26) is Apple silicon on the
          # free tier. The Intel-only alternatives are `-large` runners, which a personal
          # account cannot use. A job targeting `macos-13` does not fail — it QUEUES
          # FOREVER against a label nothing will ever claim, and because the manifest job
          # waits on the matrix, that silently strands the whole release with no
          # `latest.json`. Cost us two releases before it was spotted.
          #
          # `universal-apple-darwin` builds both slices on the arm64 runner and lipos them
          # together, so one archive serves both updater keys — see the comma-separated
          # target below.
          - os: macos-latest
            target: darwin-aarch64,darwin-x86_64
            slug: darwin-universal
            rustTargets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: app,dmg
            tauriArgs: --target universal-apple-darwin
            dir: src-tauri/target/universal-apple-darwin/release/bundle/macos
            suffix: .app.tar.gz
            ship: '../dmg/*.dmg'
          # ⚠️ `-setup.exe`, NOT `.nsis.zip` — the same v1/v2 change as the AppImage
          # above. v2 signs the installer itself, so this is another target where the
          # updater artifact and the human download are one file. Measured on 0.3.0:
          #   bazzite-store_0.3.0_x64-setup.exe
          #   bazzite-store_0.3.0_x64-setup.exe.sig
          - os: windows-latest
            target: windows-x86_64
            slug: windows-x86_64
            bundles: nsis
            dir: src-tauri/target/release/bundle/nsis
            suffix: -setup.exe
            ship: ''
            rustTargets: ''
            tauriArgs: ''
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag semantic-release just created — NOT main, which by now also
          # contains the release commit but is a moving target.
          ref: ${{ needs.release.outputs.version }}

      # ⚠️ No `version:` here on purpose — it is read from `packageManager` in
      # package.json, so CI and a laptop cannot drift. Without either, this action
      # fails with "No pnpm version is specified", which is how the first run died.
      # It must also come BEFORE setup-node, or `cache: pnpm` has no pnpm to ask.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # ⚠️ `cache: pnpm` stays EXPLICIT. setup-node v5 added automatic caching from
          # the `packageManager` field, then v6 narrowed that automation to npm only —
          # so with `pnpm@…` in package.json nothing is cached unless we say so here.
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - name: Extra Rust targets
        if: matrix.rustTargets != ''
        run: rustup target add ${{ matrix.rustTargets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.slug }}

      # ⚠️ `libudev-dev` is not optional and is easy to miss: `gilrs` — the whole
      # gamepad layer — pulls `libudev-sys`, whose build script panics with
      # "Package libudev was not found in the pkg-config search path". Nothing in the
      # error names gilrs or the gamepad, so it reads like a toolchain problem.
      # `libdbus-1-dev` is `libdbus-sys`, reached the same way through Tauri.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libudev-dev libdbus-1-dev \
            build-essential curl wget file patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # Both are repository secrets. Without them the bundler still produces the
          # archive but NO `.sig`, and the updater refuses every unsigned artifact — so
          # a missing secret shows up as "no update available", never as an error.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }} ${{ matrix.tauriArgs }}

      # ⚠️ Assert on the ARTIFACT, not on the build. Two shipped releases in a row were
      # broken in ways a green build cannot see: 0.3.1 bundled a WebKit that could not
      # create an EGL display and painted a white window, and 0.4.0 shipped the wrong
      # binary entirely — `usr/bin/protondb-index` with `Exec=protondb-index`, and no
      # `bazzite-store` in the image at all, so launching it printed a usage string.
      #
      # Both compiled, bundled, signed and uploaded without a single failing step. This
      # is the cheapest check that would have caught the second one and any repeat of it.
      # It cannot catch the first — only running the thing on a GPU can — which is why
      # the matrix comment above carries that warning separately.
      - name: The AppImage contains the app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ matrix.dir }}"
          image=$(ls *.AppImage | head -1)
          "./$image" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/bazzite-store \
            || { echo "::error::no bazzite-store binary in $image"; ls -la squashfs-root/usr/bin; exit 1; }
          grep -qx 'Exec=bazzite-store' squashfs-root/*.desktop \
            || { echo "::error::desktop entry does not launch bazzite-store"; cat squashfs-root/*.desktop; exit 1; }
          # Build-time tooling has no business in the app image, and its presence means
          # the bin-target guards in Cargo.toml have been edited away.
          if [ -e squashfs-root/usr/bin/protondb-index ]; then
            echo "::error::protondb-index is in the bundle; check autobins/required-features"
            exit 1
          fi
          rm -rf squashfs-root
          echo "$image contains bazzite-store and launches it"

      # The Windows half of the same assertion. 0.4.0's installer was 2.10 MB and
      # 0.4.1's is 4.28 MB — the wrong-binary bug hit Windows exactly as hard, and it
      # was caught by comparing file sizes by hand, which is not a process.
      #
      # ⚠️ A missing 7z is a FAILURE, not a skip. A guard that quietly passes when its
      # tool is absent is the same class of bug it exists to catch.
      - name: The installer contains the app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          command -v 7z >/dev/null || { echo "::error::7z not on PATH; cannot verify the installer"; exit 1; }
          cd "${{ matrix.dir }}"
          installer=$(ls *-setup.exe | head -1)
          listing=$(7z l "$installer")
          # ⚠️ Compare the NAME COLUMN, not the raw line. The first version of this
          # matched `[\\/]bazzite-store\.exe`, i.e. it required a path separator — but
          # NSIS lists root-level payload with no directory at all
          # ("...  16669184   bazzite-store.exe"), so it never matched and failed a
          # perfectly good 0.5.0 build. A guard that rejects correct artifacts is worse
          # than no guard: it costs a release and teaches you to ignore it.
          # `tr -d '\r'` because 7z on Windows emits CRLF and the CR would end up in $NF.
          names=$(printf '%s\n' "$listing" | tr -d '\r' | awk 'NF{print $NF}')
          printf '%s\n' "$names" | grep -qxE '(.*[\\/])?bazzite-store\.exe' \
            || { echo "::error::no bazzite-store.exe in $installer"; echo "$listing"; exit 1; }
          if printf '%s\n' "$names" | grep -qxE '(.*[\\/])?protondb-index\.exe'; then
            echo "::error::protondb-index.exe is in the installer; check autobins/required-features"
            exit 1
          fi
          echo "$installer contains bazzite-store.exe"

      # ⚠️ Both macOS runners produce `bazzite-store.app.tar.gz` — no architecture in
      # the name. Uploaded as-is with --clobber, whichever finishes second overwrites
      # the first, and the manifest then points BOTH darwin entries at one file whose
      # signature matches only one of them. The Apple silicon client would download an
      # Intel binary, or fail verification, depending on which won the race.
      #
      # So stamp the target into every updater artifact. The .dmg and -setup.exe carry
      # their own arch already and are untouched.
      - name: Disambiguate the updater artifact
        shell: bash
        run: |
          cd "${{ matrix.dir }}"
          archive=$(ls *"${{ matrix.suffix }}" | head -1)
          renamed="bazzite-store_${{ needs.release.outputs.version }}_${{ matrix.slug }}${{ matrix.suffix }}"
          if [ "$archive" != "$renamed" ]; then
            mv "$archive" "$renamed"
            mv "$archive.sig" "$renamed.sig"
          fi
          ls -la

      - name: Write this platform's manifest fragment
        run: >
          node scripts/write-latest-json.mjs
          "${{ needs.release.outputs.version }}"
          "${{ matrix.target }}"
          "${{ matrix.dir }}"
          "${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.slug }}
          # ⚠️ Named after the FIRST updater key, not the slug — see write-latest-json.
          path: latest-*.json

      # The updater archive + signature, and the human-facing installer beside them.
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.version }}" \
            "${{ matrix.dir }}"/*"${{ matrix.suffix }}" \
            "${{ matrix.dir }}"/*"${{ matrix.suffix }}.sig" \
            --clobber
          # `ship` is the human-facing installer where it differs from the updater
          # archive. Empty on Linux, where they are one file; a glob elsewhere, which
          # may still legitimately match nothing.
          shopt -s nullglob
          extra=()
          [ -n "${{ matrix.ship }}" ] && extra=( ${{ matrix.dir }}/${{ matrix.ship }} )
          if [ ${#extra[@]} -gt 0 ]; then
            gh release upload "${{ needs.release.outputs.version }}" "${extra[@]}" --clobber
          fi

  # The Flatpak — the Linux format that actually paints on Bazzite.
  #
  # ⚠️ Runs BESIDE the AppImage job rather than replacing it, on purpose. The AppImage
  # still builds and signs, `merge-latest-json.mjs` refuses to publish a feed with no
  # linux-x86_64 entry, and the in-app updater stays meaningful for anyone not installing
  # through Flatpak. Deleting the AppImage job is a separate decision with its own
  # consequences for the update feed.
  #
  # ⚠️ This job cannot verify the thing it exists to fix. A Flatpak that builds, bundles
  # and installs cleanly can still fail to create an EGL display on hardware CI does not
  # have. Only the box can answer that — see docs/PACKAGING.md.
  flatpak:
    name: flatpak
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      # The builder image carries flatpak + flatpak-builder; running in a container
      # avoids installing a whole ostree stack onto the runner.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      # ⚠️ The RELEASE TAG, not the dispatch ref. semantic-release commits the version bump
      # as part of the release, and a bare checkout here builds `main` as it was BEFORE
      # that commit — so the Flatpak of release N was built from a different tree than its
      # own AppImage and reported N-1. `__APP_VERSION__` comes from package.json at Vite
      # build time, which is why the box showed 0.5.2 while running 0.6.0 code. The
      # `bundles` job already does this; this job was simply missed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}

      # ⚠️ Belt and braces on the version label. The metainfo is committed by
      # semantic-release now, but this job is the last place the value can still be
      # wrong and the only place it is observable — `flatpak info` reads it, and a
      # wrong answer there sends people chasing a phantom "the update did not install".
      # Re-syncing costs nothing; the assertion is what actually protects it.
      - name: The metainfo announces THIS release
        run: |
          set -euo pipefail
          node scripts/sync-version.mjs "${{ needs.release.outputs.version }}"
          announced=$(grep -o '<release version="[^"]*"' \
            flatpak/com.claygorman.bazzite-store.metainfo.xml | tail -1 |
            sed 's/.*version="\([^"]*\)".*/\1/')
          if [ "$announced" != "${{ needs.release.outputs.version }}" ]; then
            echo "::error::metainfo says $announced, release is ${{ needs.release.outputs.version }}"
            exit 1
          fi
          echo "metainfo announces $announced"

      # ⚠️ The manifest pins org.gnome.Platform 50, which the builder image may not
      # already carry. Installing it explicitly means a stale image degrades to a slower
      # build rather than to a confusing "runtime not found".
      - name: Runtime and SDK
        run: |
          flatpak --system remote-add --if-not-exists --from flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak --system install -y --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.node24//25.08

      # ⚠️ The ostree repo is PERSISTENT, and that is the entire point of it.
      #
      # ostree is content-addressed: building release N+1 into the repo that already
      # holds N lets `build-update-repo` compute static deltas between them, so a client
      # updating downloads the CHANGED objects rather than the whole 17 MB app. Starting
      # from an empty repo each release still produces a working remote — which is why
      # getting this wrong looks fine — but every client re-downloads everything, every
      # time, forever.
      #
      # Absent on the very first run, and that is not an error.
      - name: Fetch the published repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*' || true
          if git clone --quiet --depth 1 --branch gh-pages \
               "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages; then
            echo "reusing published repo: $(du -sh pages/repo 2>/dev/null | cut -f1 || echo empty)"
            if [ -d pages/repo ]; then
              # ⚠️ GIT DOES NOT PRESERVE EMPTY DIRECTORIES, and an ostree repo has
              # several. Publishing drops refs/remotes, refs/mirrors, tmp and state, so
              # the clone comes back structurally invalid and `build-update-repo` dies
              # with `Listing refs: opendir(refs/remotes): No such file or directory`.
              #
              # ⚠️ This can only fail on the SECOND release and later — the first builds
              # into a fresh repo because there is nothing to clone. Exactly the delta
              # path, and it took a failed 0.9.0 to find.
              #
              # Recreated rather than committing .gitkeep files: ostree LISTS refs from
              # these directories, so a stray file inside refs/ risks being read as a ref.
              mkdir -p pages/repo/refs/heads pages/repo/refs/mirrors \
                       pages/repo/refs/remotes pages/repo/tmp pages/repo/state \
                       pages/repo/extensions pages/repo/objects
              echo "restored the empty directories git dropped"
            fi
          else
            echo "no gh-pages branch yet - starting a fresh ostree repo"
            mkdir -p pages
          fi

      - name: Build
        run: |
          flatpak-builder --disable-rofiles-fuse --repo=pages/repo --force-clean \
            build flatpak/com.claygorman.bazzite-store.yml

      # `build-update-repo` is what actually makes the directory a SERVABLE remote: it
      # writes the summary clients read to discover refs. Without it the repo has the
      # objects and no index, and `flatpak remote-add` finds nothing.
      #
      # ⚠️ `--prune-depth=3` bounds history. Without it every release's objects are kept
      # forever, and GitHub Pages has a 1 GB limit that a 17 MB app reaches in well under
      # a hundred releases. Three deep keeps rollback possible.
      - name: Index and prune the repo
        run: |
          set -euo pipefail
          flatpak build-update-repo pages/repo \
            --generate-static-deltas --prune --prune-depth=3
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          base="https://${owner}.github.io/${name}"
          # ⚠️ Jekyll is on by default for Pages and silently drops paths beginning with
          # an underscore or a dot. ostree does not currently use any, but a single
          # dropped object is an unrecoverable remote that still looks published.
          touch pages/.nojekyll
          printf '%s\n' \
            '[Flatpak Repo]' \
            'Title=Bazzite Native Store' \
            "Url=${base}/repo/" \
            "Homepage=https://github.com/${GITHUB_REPOSITORY}" \
            'Comment=Controller-first Steam store client for Bazzite Game Mode' \
            > "pages/bazzite-store.flatpakrepo"
          # ⚠️ A plain version file, read by the app on a fifteen-minute loop.
          # The portal's update monitor cannot answer "am I out of date right now" —
          # it announces on its own schedule and never announces the NEGATIVE, so it
          # can neither be asked nor confirm currency. Two version strings can do both.
          printf '{"version":"%s","commit":"%s"}\n' \
            "${{ needs.release.outputs.version }}" "${GITHUB_SHA}" > pages/version.json
          echo "remote will be served from ${base}/repo/"
          echo "version feed: $(cat pages/version.json)"

      # ⚠️ `--runtime-repo` is not optional, and 0.5.1 proved it. Without it the bundle
      # says which runtime it needs but not WHERE that runtime comes from, so installing
      # a purely local file sends flatpak looking for a remote that can supply
      # org.gnome.Platform//50 — and on the target box that hung with "Timeout was
      # reached" even though the runtime was already installed. The flag embeds the
      # flathub repo definition so resolution is answerable offline-ish and instant.
      - name: Bundle
        run: |
          flatpak build-bundle pages/repo \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "bazzite-store_${{ needs.release.outputs.version }}_linux-x86_64.flatpak" \
            com.claygorman.bazzite-store

      # The same class of assertion the AppImage gets: check the ARTIFACT, not the build.
      # A bundle that installs and then has no binary is a green build and a dead app.
      - name: The bundle contains the app
        run: |
          set -euo pipefail
          bundle=$(ls *.flatpak | head -1)
          flatpak --user remote-add --no-gpg-verify --if-not-exists ci-check pages/repo
          flatpak --user install -y --noninteractive --bundle "$bundle"
          test -x "/var/lib/flatpak/app/com.claygorman.bazzite-store/current/active/files/bin/bazzite-store" \
            || test -x "$HOME/.local/share/flatpak/app/com.claygorman.bazzite-store/current/active/files/bin/bazzite-store" \
            || { echo "::error::no bazzite-store binary inside $bundle"; exit 1; }
          echo "$bundle contains bazzite-store"

      # ⚠️ Published only AFTER the bundle assertion above. A repo is what clients pull
      # from automatically, so shipping one that installs to a missing binary is worse
      # than shipping nothing — the bundle check is the gate.
      #
      # ⚠️ Squashed to a single orphan commit every time. The ostree history that matters
      # lives INSIDE these files, not in git; keeping git history too would accumulate
      # ~20 MB of binary objects per release in a branch nobody reads.
      - name: Publish the repo to Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd pages
          rm -rf .git
          git init --quiet -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "repo: ${{ needs.release.outputs.version }}"
          git push --force --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "published $(du -sh . | cut -f1) to gh-pages"

      # ⚠️ `--repo` explicitly, and safe.directory first. This job runs in a container
      # as a different uid than the checkout, so git refuses the working tree with
      # "detected dubious ownership" — and `gh` infers the repository FROM git, so it
      # dies before it ever talks to the API. The flatpak had already built, bundled and
      # passed its own assertion when 0.5.0 failed here; only the upload was broken.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          gh release upload "${{ needs.release.outputs.version }}" *.flatpak \
            --clobber --repo "$GITHUB_REPOSITORY"

  manifest:
    name: Publish the update feed
    needs: [release, bundles]
    # ⚠️ `always()` so a partial matrix still publishes: if macOS fails, Linux clients
    # must still get their update. merge-latest-json refuses to write a manifest with
    # no linux-x86_64 in it, which is the case that IS a failed release.
    if: always() && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: fragments

      - run: node scripts/merge-latest-json.mjs "${{ needs.release.outputs.version }}" fragments

      - name: Attach the feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.version }}" latest.json --clobber
