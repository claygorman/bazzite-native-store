# Release — the GitHub counterpart of the GitLab `release` stage.
name: Release

on:
  # ⚠️ Manual, mirroring `when: manual` on the GitLab `semantic-release` job.
  # Cutting a release also publishes an update that every installed client will
  # offer to install, so it is a decision rather than a consequence of merging.
  workflow_dispatch:

concurrency:
  # Never two releases at once — they would race for the same tag.
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tags, commits and releases

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      published: ${{ steps.semantic.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the whole history to work out the next version
          # from the commits since the last tag.
          fetch-depth: 0
          persist-credentials: true

      # ⚠️ No `version:` here on purpose — it is read from `packageManager` in
      # package.json, so CI and a laptop cannot drift. Without either, this action
      # fails with "No pnpm version is specified", which is how the first run died.
      # It must also come BEFORE setup-node, or `cache: pnpm` has no pnpm to ask.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # ⚠️ `cache: pnpm` stays EXPLICIT. setup-node v5 added automatic caching from
          # the `packageManager` field, then v6 narrowed that automation to npm only —
          # so with `pnpm@…` in package.json nothing is cached unless we say so here.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: semantic
        env:
          # The default token is enough here: same-repo tags, commits and releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          npx semantic-release
          git fetch --tags --force
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

          # ⚠️ Compare the tag before and after rather than trusting the exit code.
          # semantic-release exits 0 when it decides NOT to release (no feat/fix
          # since the last tag), and a build job that ran anyway would rebuild and
          # re-upload the previous version's assets over themselves.
          if [ "$before" != "$after" ]; then
            echo "published=true"     >> "$GITHUB_OUTPUT"
            echo "version=$after"     >> "$GITHUB_OUTPUT"
            echo "Released $after"
          else
            echo "published=false"    >> "$GITHUB_OUTPUT"
            echo "No release: nothing since $before warrants one."
          fi

  appimage:
    name: Build and publish the AppImage
    needs: release
    if: needs.release.outputs.published == 'true'
    # ⚠️ 22.04 pins the glibc the binary links against. A newer runner produces an
    # AppImage that will not start on an older host, and the failure is a bare
    # "version `GLIBC_2.xx' not found" with nothing pointing back at CI.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag semantic-release just created — NOT main, which by now also
          # contains the release commit but is a moving target.
          ref: ${{ needs.release.outputs.version }}

      # ⚠️ No `version:` here on purpose — it is read from `packageManager` in
      # package.json, so CI and a laptop cannot drift. Without either, this action
      # fails with "No pnpm version is specified", which is how the first run died.
      # It must also come BEFORE setup-node, or `cache: pnpm` has no pnpm to ask.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # ⚠️ `cache: pnpm` stays EXPLICIT. setup-node v5 added automatic caching from
          # the `packageManager` field, then v6 narrowed that automation to npm only —
          # so with `pnpm@…` in package.json nothing is cached unless we say so here.
          cache: pnpm

      # ⚠️ `@stable` is a moving ref that tracks the current Rust release, and is
      # what this action documents. It is not a version tag to bump.
      - uses: dtolnay/rust-toolchain@stable
      # v2 IS the latest major — not a stale pin.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential curl wget file patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build the AppImage
        env:
          # Both are repository secrets. Without them the bundler still produces an
          # AppImage but NO `.sig`, and the updater refuses every unsigned artifact —
          # so a missing secret shows up as "no update available", never as an error.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles appimage

      - name: Write latest.json
        run: node scripts/write-latest-json.mjs "${{ needs.release.outputs.version }}"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.version }}" \
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz \
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig \
            latest.json \
            --clobber
