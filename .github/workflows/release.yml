# Release — the GitHub counterpart of the GitLab `release` stage.
name: Release

on:
  # ⚠️ Manual, mirroring `when: manual` on the GitLab `semantic-release` job.
  # Cutting a release also publishes an update that every installed client will
  # offer to install, so it is a decision rather than a consequence of merging.
  workflow_dispatch:

concurrency:
  # Never two releases at once — they would race for the same tag.
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tags, commits and releases

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      published: ${{ steps.semantic.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the whole history to work out the next version
          # from the commits since the last tag.
          fetch-depth: 0
          persist-credentials: true

      # ⚠️ No `version:` here on purpose — it is read from `packageManager` in
      # package.json, so CI and a laptop cannot drift. Without either, this action
      # fails with "No pnpm version is specified", which is how the first run died.
      # It must also come BEFORE setup-node, or `cache: pnpm` has no pnpm to ask.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # ⚠️ `cache: pnpm` stays EXPLICIT. setup-node v5 added automatic caching from
          # the `packageManager` field, then v6 narrowed that automation to npm only —
          # so with `pnpm@…` in package.json nothing is cached unless we say so here.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: semantic
        env:
          # The default token is enough here: same-repo tags, commits and releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          npx semantic-release
          git fetch --tags --force
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

          # ⚠️ Compare the tag before and after rather than trusting the exit code.
          # semantic-release exits 0 when it decides NOT to release (no feat/fix
          # since the last tag), and a build job that ran anyway would rebuild and
          # re-upload the previous version's assets over themselves.
          if [ "$before" != "$after" ]; then
            echo "published=true"     >> "$GITHUB_OUTPUT"
            echo "version=$after"     >> "$GITHUB_OUTPUT"
            echo "Released $after"
          else
            echo "published=false"    >> "$GITHUB_OUTPUT"
            echo "No release: nothing since $before warrants one."
          fi

  bundles:
    name: ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # ⚠️ One platform failing must not block the others. Linux is the shipping
      # target; macOS and Windows are a convenience, and losing them to a transient
      # runner problem should not cost the release.
      fail-fast: false
      matrix:
        include:
          # ⚠️ ubuntu-22.04, not `latest` — it is the oldest supported runner, so it
          # links the oldest glibc. A binary built on a newer one refuses to start on
          # an older host with a bare "GLIBC_2.xx not found".
          # ⚠️ `.AppImage`, NOT `.AppImage.tar.gz`. Tauri v1 tarballed the AppImage
          # before signing; v2 signs the AppImage itself, so the updater artifact and
          # the human download are the SAME file and there is no `ship:` here. Measured
          # on release 0.2.0, whose bundle dir held exactly:
          #   bazzite-store_0.2.0_amd64.AppImage
          #   bazzite-store_0.2.0_amd64.AppImage.sig
          - os: ubuntu-22.04
            target: linux-x86_64
            bundles: appimage
            dir: src-tauri/target/release/bundle/appimage
            suffix: .AppImage
            ship: ''
          # macos-latest is Apple silicon; macos-13 is the last Intel runner.
          - os: macos-latest
            target: darwin-aarch64
            bundles: app,dmg
            dir: src-tauri/target/release/bundle/macos
            suffix: .app.tar.gz
            ship: '../dmg/*.dmg'
          - os: macos-13
            target: darwin-x86_64
            bundles: app,dmg
            dir: src-tauri/target/release/bundle/macos
            suffix: .app.tar.gz
            ship: '../dmg/*.dmg'
          # ⚠️ `-setup.exe`, NOT `.nsis.zip` — the same v1/v2 change as the AppImage
          # above. v2 signs the installer itself, so this is another target where the
          # updater artifact and the human download are one file. Measured on 0.3.0:
          #   bazzite-store_0.3.0_x64-setup.exe
          #   bazzite-store_0.3.0_x64-setup.exe.sig
          - os: windows-latest
            target: windows-x86_64
            bundles: nsis
            dir: src-tauri/target/release/bundle/nsis
            suffix: -setup.exe
            ship: ''
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag semantic-release just created — NOT main, which by now also
          # contains the release commit but is a moving target.
          ref: ${{ needs.release.outputs.version }}

      # ⚠️ No `version:` here on purpose — it is read from `packageManager` in
      # package.json, so CI and a laptop cannot drift. Without either, this action
      # fails with "No pnpm version is specified", which is how the first run died.
      # It must also come BEFORE setup-node, or `cache: pnpm` has no pnpm to ask.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # ⚠️ `cache: pnpm` stays EXPLICIT. setup-node v5 added automatic caching from
          # the `packageManager` field, then v6 narrowed that automation to npm only —
          # so with `pnpm@…` in package.json nothing is cached unless we say so here.
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # ⚠️ `libudev-dev` is not optional and is easy to miss: `gilrs` — the whole
      # gamepad layer — pulls `libudev-sys`, whose build script panics with
      # "Package libudev was not found in the pkg-config search path". Nothing in the
      # error names gilrs or the gamepad, so it reads like a toolchain problem.
      # `libdbus-1-dev` is `libdbus-sys`, reached the same way through Tauri.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libudev-dev libdbus-1-dev \
            build-essential curl wget file patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # Both are repository secrets. Without them the bundler still produces the
          # archive but NO `.sig`, and the updater refuses every unsigned artifact — so
          # a missing secret shows up as "no update available", never as an error.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      # ⚠️ Both macOS runners produce `bazzite-store.app.tar.gz` — no architecture in
      # the name. Uploaded as-is with --clobber, whichever finishes second overwrites
      # the first, and the manifest then points BOTH darwin entries at one file whose
      # signature matches only one of them. The Apple silicon client would download an
      # Intel binary, or fail verification, depending on which won the race.
      #
      # So stamp the target into every updater artifact. The .dmg and -setup.exe carry
      # their own arch already and are untouched.
      - name: Disambiguate the updater artifact
        shell: bash
        run: |
          cd "${{ matrix.dir }}"
          archive=$(ls *"${{ matrix.suffix }}" | head -1)
          renamed="bazzite-store_${{ needs.release.outputs.version }}_${{ matrix.target }}${{ matrix.suffix }}"
          if [ "$archive" != "$renamed" ]; then
            mv "$archive" "$renamed"
            mv "$archive.sig" "$renamed.sig"
          fi
          ls -la

      - name: Write this platform's manifest fragment
        run: >
          node scripts/write-latest-json.mjs
          "${{ needs.release.outputs.version }}"
          "${{ matrix.target }}"
          "${{ matrix.dir }}"
          "${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.target }}
          path: latest-${{ matrix.target }}.json

      # The updater archive + signature, and the human-facing installer beside them.
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.version }}" \
            "${{ matrix.dir }}"/*"${{ matrix.suffix }}" \
            "${{ matrix.dir }}"/*"${{ matrix.suffix }}.sig" \
            --clobber
          # `ship` is the human-facing installer where it differs from the updater
          # archive. Empty on Linux, where they are one file; a glob elsewhere, which
          # may still legitimately match nothing.
          shopt -s nullglob
          extra=()
          [ -n "${{ matrix.ship }}" ] && extra=( ${{ matrix.dir }}/${{ matrix.ship }} )
          if [ ${#extra[@]} -gt 0 ]; then
            gh release upload "${{ needs.release.outputs.version }}" "${extra[@]}" --clobber
          fi

  manifest:
    name: Publish the update feed
    needs: [release, bundles]
    # ⚠️ `always()` so a partial matrix still publishes: if macOS fails, Linux clients
    # must still get their update. merge-latest-json refuses to write a manifest with
    # no linux-x86_64 in it, which is the case that IS a failed release.
    if: always() && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: fragments

      - run: node scripts/merge-latest-json.mjs "${{ needs.release.outputs.version }}" fragments

      - name: Attach the feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.version }}" latest.json --clobber
